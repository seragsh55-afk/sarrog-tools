<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم سرّوج - بالصور</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--pri:#22c55e;--blue:#3b82f6}
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);color:#fff}
.header{padding:20px;text-align:center;background:var(--card);border-bottom:2px solid var(--pri)}
.tabs{display:flex;gap:5px;padding:10px;background:var(--card);overflow-x:auto}
.tab{padding:10px 15px;border-radius:8px;cursor:pointer;background:#334155;white-space:nowrap}
.tab.active{background:var(--pri);color:#000;font-weight:bold}
.section{display:none;padding:20px;max-width:900px;margin:auto}
.section.active{display:block}
input,textarea,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;background:#334155;color:#fff}
button{padding:12px 18px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
.card{background:var(--card);padding:12px;border-radius:12px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:8px;padding:4px}
.green{background:var(--pri);color:#000;width:100%}
.blue{background:var(--blue);color:#fff;width:100%;margin-top:15px}
.preview{width:80px;height:80px;background:#fff;border-radius:12px;display:none;margin:10px auto;object-fit:contain;padding:5px}
</style>
</head>
<body>
<div class="header"><h1>🔧 سرّوج - لوحة تحكم بالصور</h1></div>
<div class="tabs">
<div class="tab active" onclick="openTab('tools',this)">🛠️ الأدوات بالصور</div>
<div class="tab" onclick="openTab('seo',this)">📈 التسويق</div>
<div class="tab" onclick="openTab('ads',this)">💰 الإعلانات</div>
</div>

<div id="tools" class="section active">
<h3>أضف أداة جديدة</h3>
<input id="token" type="password" placeholder="GitHub Token ghp_... (احفظه مرة واحدة)">
<input id="t_name" placeholder="اسم الأداة - مثال: كشف بيانات الصور">
<textarea id="t_desc" placeholder="وصف الأداة"></textarea>
<input id="t_cat" placeholder="القسم: أمن المعلومات">
<label>📸 صورة الأيقونة (بدل الإيموجي)</label>
<input id="t_image" type="file" accept="image/*" onchange="previewImg(this)">
<img id="imgPreview" class="preview">
<input id="t_link" placeholder="رابط الأداة (اختياري) #">
<button class="green" onclick="addTool()">+ إضافة للقائمة</button>

<div id="list" style="margin-top:20px"></div>
<button class="blue" onclick="publishAll()">🚀 نشر كل الأدوات للموقع الرئيسي</button>
<p id="status" style="text-align:center;color:#94a3b8"></p>
</div>

<div id="seo" class="section">
<h2>📈 التسويق والسيو</h2>
<input id="seo_title" value="سرّوج - منصة أدوات ذكية وخدمات شاملة">
<textarea id="seo_desc">منصة سرّوج: كشف الصور، تأليف أغاني AI، تحويل صوت لنص، مشاريع تخرج، كفالة يتيم</textarea>
<button class="green" onclick="navigator.clipboard.writeText(document.getElementById('seo_desc').value);alert('تم النسخ')">📋 نسخ الوصف</button>
</div>

<div id="ads" class="section">
<h2>💰 الإعلانات</h2>
<textarea id="ad_code" placeholder="الصق كود AdSense هنا"></textarea>
<button class="green" onclick="alert('احفظ الكود في index.html')">حفظ</button>
</div>

<script>
let tools=[]; let currentIconBase64='';
function openTab(id,el){
document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.getElementById(id).classList.add('active'); el.classList.add('active');
}
function previewImg(input){
const file=input.files[0]; if(!file) return;
const reader=new FileReader();
reader.onload=e=>{
currentIconBase64=e.target.result;
const p=document.getElementById('imgPreview'); p.src=currentIconBase64; p.style.display='block';
};
reader.readAsDataURL(file);
}
async function load(){
try{
const r=await fetch('tools.json?v='+Date.now(),{cache:'no-store'});
tools=await r.json(); if(!Array.isArray(tools)) tools=[];
}catch{tools=[]}
render();
}
function render(){
document.getElementById('list').innerHTML=tools.map((t,i)=>{
let iconHtml = t.icon && t.icon.startsWith('data:image')
? `<img src="${t.icon}">`
: (t.icon && t.icon.includes('/')? `<img src="${t.icon}">` : `<span style="font-size:30px">${t.icon||'🔧'}</span>`);
return `<div class="card"><div style="display:flex;align-items:center;gap:10px">${iconHtml}<div><b>${t.name}</b><br><small style="color:#94a3b8">${t.category}</small></div></div><button onclick="del(${i})" style="background:#ef4444;color:#fff">حذف</button></div>`
}).join('')||'<p style="text-align:center;color:#94a3b8">لا توجد أدوات - أضف أداة بالصورة من فوق</p>';
}
function addTool(){
const name=document.getElementById('t_name').value.trim();
if(!name) return alert('اكتب اسم الأداة');
if(!currentIconBase64) return alert('اختار صورة للأداة أولاً');
const t={
id: Date.now().toString(),
name: name,
description: document.getElementById('t_desc').value.trim(),
icon: currentIconBase64,
category: document.getElementById('t_cat').value.trim()||'عام',
link: document.getElementById('t_link').value.trim()||'#',
keywords: 'سرّوج, '+name
};
tools.push(t); render();
document.getElementById('t_name').value=''; document.getElementById('t_desc').value=''; currentIconBase64=''; document.getElementById('imgPreview').style.display='none'; document.getElementById('t_image').value='';
alert('✅ تمت إضافة الأداة للقائمة - تقدر تضيف تاني، وفي النهاية اضغط نشر');
}
function del(i){tools.splice(i,1);render();}
async function publishAll(){
const token=document.getElementById('token').value.trim();
if(!token) return alert('الصق التوكن');
document.getElementById('status').innerText='جاري النشر...';
try{
const get=await fetch('https://api.github.com/repos/seragsh55-afk/sarrog-tools/contents/tools.json?v='+Date.now(),{headers:{Authorization:'token '+token},cache:'no-store'});
const data=await get.json(); const sha=data.sha;
const content=btoa(unescape(encodeURIComponent(JSON.stringify(tools,null,2))));
const res=await fetch('https://api.github.com/repos/seragsh55-afk/sarrog-tools/contents/tools.json',{
method:'PUT',headers:{Authorization:'token '+token,'Content-Type':'application/json'},
body:JSON.stringify({message:'تحديث أدوات سرّوج بالصور - لوحة تحكم',content,sha})
});
if(res.ok){document.getElementById('status').innerText='✅ تم النشر! انتظر دقيقة وافتح موقعك'; alert('✅ اتنشرت كل الأدوات بالصور!');}
else{document.getElementById('status').innerText='❌ فشل'; alert('خطأ: '+(await res.text()));}
}catch(e){document.getElementById('status').innerText='خطأ: '+e.message}
}
load();
</script>
</body>
</html>
