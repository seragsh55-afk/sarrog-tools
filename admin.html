<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة تحكم سرّوج</title>
<style>
body{font-family:system-ui;background:#111;color:#fff;padding:20px}
input,textarea{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none}
button{padding:12px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
.card{background:#222;padding:15px;border-radius:10px;margin:10px 0}
</style>
</head>
<body>
<h1>🔧 لوحة تحكم سرّوج</h1>

<input id="token" type="password" placeholder="GitHub Token - ghp_...">
<input id="name" placeholder="اسم الأداة - مثال: كشف بيانات الصور">
<textarea id="desc" placeholder="وصف الأداة"></textarea>
<input id="icon" placeholder="أيقونة - مثال: 📸">
<input id="keywords" placeholder="كلمات مفتاحية - مثال: سرّوج, كشف الصور">
<input id="category" placeholder="القسم - مثال: أمن المعلومات">

<button onclick="addTool()" style="background:#0f0;color:#000;width:100%">+ إضافة أداة جديدة</button>

<div id="list"></div>
<button onclick="publish()" style="background:#00f;color:#fff;width:100%;margin-top:20px">🚀 حفظ ونشر للجميع</button>

<script>
let tools = [];
async function load(){
  try{
    const r = await fetch('tools.json?v='+Date.now());
    tools = await r.json();
    show();
  }catch(e){ tools=[]; }
}
function show(){
  document.getElementById('list').innerHTML = tools.map((t,i)=>`
    <div class="card">
      ${t.icon} <b>${t.name}</b> - ${t.category}
      <button onclick="del(${i})" style="background:red;float:left">حذف</button>
    </div>
  `).join('');
}
function addTool(){
  const t = {
    id: Date.now().toString(),
    name: document.getElementById('name').value.trim() || 'أداة سرّوج',
    description: document.getElementById('desc').value.trim() || 'أداة من منصة سرّوج',
    icon: document.getElementById('icon').value.trim() || '🔧',
    keywords: document.getElementById('keywords').value.trim() || 'سرّوج',
    category: document.getElementById('category').value.trim() || 'عام',
    link: '#'
  };
  if(!t.name) return alert('اكتب اسم الأداة');
  tools.push(t);
  show();
  document.getElementById('name').value='';
  document.getElementById('desc').value='';
}
function del(i){ tools.splice(i,1); show(); }

async function publish(){
  const token = document.getElementById('token').value.trim();
  if(!token) return alert('الصق التوكن');
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(tools, null, 2))));
  
  const get = await fetch('https://api.github.com/repos/seragsh55-afk/sarrog-tools/contents/tools.json',{
    headers:{Authorization:'token '+token}
  });
  const sha = (await get.json()).sha;

  const res = await fetch('https://api.github.com/repos/seragsh55-afk/sarrog-tools/contents/tools.json',{
    method:'PUT',
    headers:{Authorization:'token '+token,'Content-Type':'application/json'},
    body: JSON.stringify({message:'تحديث أدوات سرّوج',content,sha})
  });
  if(res.ok){ alert('✅ تم النشر! انتظر دقيقة وحدث موقعك'); }
  else{ alert('❌ فشل: '+await res.text()); }
}
load();
</script>
</body>
</html>
