<!DOCTYPE html><html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>لوحة التحكم - sarrog_tools</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="loginBox" style="max-width:400px; margin:100px auto; background:var(--card); padding:30px; border-radius:14px;">
  <h2 style="text-align:center;">تسجيل الدخول</h2>
  <input id="username" type="text" placeholder="اسم المستخدم" style="width:100%; padding:10px; margin:10px 0;">
  <input id="password" type="password" placeholder="كلمة السر" style="width:100%; padding:10px; margin:10px 0;">
  <button onclick="login()" style="width:100%; padding:12px; background:var(--accent); color:#fff; border:none; border-radius:8px;">دخول</button>
  <p id="error" style="color:red; text-align:center;"></p>
</div>
<div id="adminPanel" style="display:none; max-width:600px; margin:40px auto;">
  <h2>إضافة أداة جديدة</h2>
  <input id="toolName" placeholder="اسم الأداة" style="width:100%; padding:10px; margin:10px 0;">
  <input id="toolIcon" placeholder="الإيموجي مثلا 🤖" style="width:100%; padding:10px; margin:10px 0;">
  <select id="toolPage" style="width:100%; padding:10px; margin:10px 0;">
    <option value="tools.html">الأدوات</option>
    <option value="ai.html">أدوات الذكاء</option>
  </select>
  <button onclick="addTool()" style="padding:10px 20px; background:var(--accent); color:#fff; border:none; border-radius:8px;">إضافة</button>
  <button onclick="logout()" style="padding:10px 20px; background:red; color:#fff; border:none; border-radius:8px;">خروج</button>
  <p id="msg"></p>
</div>
<script>
const ADMIN_USER = "admin"; const ADMIN_PASS = "sarrog2026";
function login(){const u = document.getElementById('username').value; const p = document.getElementById('password').value;
if(u === ADMIN_USER && p === ADMIN_PASS){localStorage.setItem('loggedIn', 'true'); showPanel();} 
else{document.getElementById('error').innerText = "خطأ في اسم المستخدم أو كلمة السر";}}
function logout(){localStorage.removeItem('loggedIn'); location.reload();}
function showPanel(){document.getElementById('loginBox').style.display = 'none'; document.getElementById('adminPanel').style.display = 'block';}
function addTool(){const name = document.getElementById('toolName').value; const icon = document.getElementById('toolIcon').value; const page = document.getElementById('toolPage').value;
document.getElementById('msg').innerText = `انسخ ده في script.js: {name: "${name}", page: "${page}", icon: "${icon}"},`;}
if(localStorage.getItem('loggedIn') === 'true'){ showPanel(); }
</script></body></html>
