<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول الصوت إلى نص المقالات الطويلة</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #d1d5db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 1000px; /* توسيع الواجهة لتستوعب مساحة أكبر */
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: var(--primary-color);
        }

        p.subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        select, button {
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        select {
            flex: 1;
            background-color: #fff;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #ef4444;
            color: white;
            border: none;
            font-weight: 600;
        }

        .btn-secondary:hover {
            background-color: #dc2626;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-color);
        }

        .btn-outline:hover {
            background-color: #f9fafb;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #4b5563;
            font-weight: 600;
            background-color: #f9fafb;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #9ca3af;
        }

        .status-dot.active {
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .counters {
            display: flex;
            gap: 15px;
        }

        /* تكبير مستطيل النص واستيعاب النصوص الضخمة */
        textarea {
            width: 100%;
            height: 480px; /* زيادة الارتفاع بشكل كبير */
            padding: 20px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            resize: vertical;
            font-size: 1.1rem;
            line-height: 1.8;
            outline: none;
            margin-bottom: 16px;
            overflow-y: auto; /* شريط تمرير ذكي للنصوص الطويلة جداً */
            background-color: #fafafa;
        }

        textarea:focus {
            border-color: var(--primary-color);
            background-color: #ffffff;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>محول الصوت إلى نص المقالات الطويلة</h1>
    <p class="subtitle">تحدث بحرية لإنشاء نصوص طويلة ودراسات تتجاوز الآلاف من الكلمات</p>

    <div class="controls">
        <select id="languageSelect">
            <option value="ar-SA">العربية (Arabic)</option>
            <option value="en-US">English (US)</option>
            <option value="ha-NG">Hausa (Nigeria)</option>
        </select>
        <button id="startBtn" class="btn-primary">بدء التسجيل المستمر</button>
        <button id="stopBtn" class="btn-secondary" style="display:none;">إيقاف التسجيل</button>
    </div>

    <div class="status-bar">
        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">جاهز للتسجيل</span>
        </div>
        <div class="counters">
            <span id="wordCount">عدد الكلمات: 0</span>
            <span>|</span>
            <span id="charCount">عدد الحروف: 0</span>
        </div>
    </div>

    <!-- المستطيل فارغ وجاهز لاستقبال النصوص الطويلة جدًا -->
    <textarea id="output" placeholder="ابدأ الكلام وسيبدأ النص بالظهور هنا تلقائياً بدون حد أقصى..."></textarea>

    <div class="actions">
        <button id="copyBtn" class="btn-outline">نسخ النص كامل</button>
        <button id="clearBtn" class="btn-outline">مسح الشاشة</button>
    </div>
</div>

<script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const output = document.getElementById('output');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const languageSelect = document.getElementById('languageSelect');
    const wordCountDisplay = document.getElementById('wordCount');
    const charCountDisplay = document.getElementById('charCount');

    let finalTranscript = ''; // متغير لحفظ الكلمات السابقة دون ضياع
    let isRecognizing = false;

    // دالة تحديث عداد الكلمات والحروف
    function updateCounters() {
        const text = output.value.trim();
        const words = text ? text.match(/\S+/g) : [];
        wordCountDisplay.textContent = `عدد الكلمات: ${words ? words.length : 0}`;
        charCountDisplay.textContent = `عدد الحروف: ${output.value.length}`;
    }

    output.addEventListener('input', updateCounters);

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert('متصفحك لا يدعم خاصية تحويل الصوت إلى نص. يُفضل استخدام Google Chrome.');
    } else {
        const recognition = new SpeechRecognition();
        recognition.continuous = true; // استمرار التسجيل وعدم التوقف تلقائياً
        recognition.interimResults = true; // إظهار الكلمات فور النطق بها

        startBtn.addEventListener('click', () => {
            recognition.lang = languageSelect.value;
            finalTranscript = output.value; // احتفاظ بالمتن الحالي إن وجد
            recognition.start();
            isRecognizing = true;
            startBtn.style.display = 'none';
            stopBtn.style.display = 'inline-block';
            statusText.textContent = 'جاري الاستماع... يمكنك التحدث لفترات طويلة';
            statusDot.classList.add('active');
        });

        stopBtn.addEventListener('click', () => {
            isRecognizing = false;
            recognition.stop();
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
            statusText.textContent = 'تم إيقاف التسجيل';
            statusDot.classList.remove('active');
        });

        recognition.onresult = (event) => {
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript + ' ';
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            output.value = finalTranscript + interimTranscript;
            
            // التمرير التلقائي لأسفل مع زيادة حجم النص
            output.scrollTop = output.scrollHeight;
            updateCounters();
        };

        // إعادة التشغيل تلقائياً إذا توقف المحرك أثناء الكلام الطويل
        recognition.onend = () => {
            if (isRecognizing) {
                recognition.start();
            }
        };

        recognition.onerror = (event) => {
            if (event.error !== 'no-speech') {
                statusText.textContent = 'خطأ: ' + event.error;
                statusDot.classList.remove('active');
            }
        };

        copyBtn.addEventListener('click', () => {
            if (!output.value) return;
            output.select();
            document.execCommand('copy');
            alert('تم نسخ كامل النص بنجاح!');
        });

        clearBtn.addEventListener('click', () => {
            if (confirm('هل أنت تأكد من مسح النص الكامل؟')) {
                output.value = '';
                finalTranscript = '';
                updateCounters();
            }
        });
    }
</script>

</body>
</html>
